<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clash Review</title>
<link rel="stylesheet" href="/kit/kit.css">
<link rel="stylesheet" href="/app.css">
<!-- 配色、显示设置、显示参数、心跳：本工具目录的 web-kit/（随工具带的副本） -->
<script src="/kit/kit.js" data-prefix="cr"></script>
</head>
<body>
<header class="top">
  <span class="brand">Clash Review</span>
  <nav class="tabs" aria-label="页面">
    <a class="tab" href="#pending" data-page="pending">待审 <span class="badge hot" id="n-pending">–</span></a>
    <a class="tab" href="#routed" data-page="routed">地域放行 <span class="badge" id="n-routed">–</span></a>
    <a class="tab" href="#rules" data-page="rules">规则</a>
  </nav>
  <div class="grow"></div>
  <div class="status" id="status"><span class="st muted">读取状态…</span></div>
  <button class="btn btn-ghost" id="settings" style="width:32px;padding:0" aria-label="显示设置" title="显示设置">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg>
  </button>
  <button class="btn btn-ghost" id="theme" style="width:32px;padding:0" aria-label="切换深浅色" title="切换深浅色">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
  </button>
</header>
<div id="page"></div>
<dialog class="help" id="help" aria-labelledby="help-title">
  <div class="hd"><h2 id="help-title"></h2><span class="grow"></span><button class="btn btn-ghost btn-sm" data-act="help-close">关闭 <span class="kbd">Esc</span></button></div>
  <div class="bd" id="help-body"></div>
</dialog>
<dialog class="help" id="model" aria-labelledby="model-title">
  <div class="hd"><h2 id="model-title">问哪个模型</h2><span class="grow"></span><button class="btn btn-ghost btn-sm" data-act="model-close">关闭 <span class="kbd">Esc</span></button></div>
  <div class="bd" id="model-body"></div>
</dialog>
<div class="toast hidden" id="toast" role="alert"></div>
<script src="/app.js"></script>
</body>
</html>
